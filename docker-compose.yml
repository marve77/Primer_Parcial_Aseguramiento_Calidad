version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: umg_postgres
    env_file:
      - .env
    ports:
      - "5433:5433"
    command: -p 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - umg_network

  backend:
    image: marve77j/actividsades-backend:v1.1
    container_name: umg_backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5433
    ports:
      - "3010:3000"
    depends_on:
      - postgres
    networks:
      - umg_network
      - proxy_network
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    image: marve77j/actividades-umg:v1.1
    container_name: umg_frontend
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - umg_network
      - proxy_network

networks:
  umg_network:
    driver: bridge
  proxy_network:
    external: true

volumes:
  pgdata:
  backend_uploads:
