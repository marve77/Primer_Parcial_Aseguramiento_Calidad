version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: umg_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-umg_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - umg_network

networks:
  umg_network:
    driver: bridge

volumes:
  pgdata:
